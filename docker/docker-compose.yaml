version: '3'
volumes: 
  volume_DB:

services:
  web:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: dotnet_backend
    restart: unless-stopped
    ports:
      - "7229:7229"
    depends_on:
      - db
    networks:
      - app_net
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: unless-stopped
    volumes:
      - volume_DB:/mnt/volume_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    networks:
      - app_net
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    #volumes:
     # - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    networks:
      - app_net

networks:
  app_net:
    driver: bridge