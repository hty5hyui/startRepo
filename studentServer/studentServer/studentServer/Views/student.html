<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Административная панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .auth-modal {
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .blur-background {
            filter: blur(5px);
            pointer-events: none;
        }

        .tab-btn.active {
            color: #0d9488;
            border-bottom-color: #0d9488;
        }

        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: grid;
            }

        .edit-tab-content {
            display: none;
        }

            .edit-tab-content.active {
                display: grid;
            }
    </style>
</head>
<body class="bg-blue-50 min-h-screen">
    <!-- Шапка -->
    <header class="bg-teal-700 text-blue-50 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="#" class="text-blue-50 hover:text-teal-200 transition">Главная</a>
                <span class="text-blue-50 mx-1">|</span>
                <a href="#" class="text-teal-200 hover:text-blue-100 transition">Сотрудники</a>
            </div>
            <button id="authBtn" class="bg-teal-100 text-teal-800 px-4 py-2 rounded-lg font-medium hover:bg-teal-200 transition flex items-center space-x-2">
                <i class="fas fa-user"></i>
                <span>Войти</span>
            </button>
        </div>
    </header>

    <!-- Основное содержимое -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-teal-800">Редактор базы сотрудников</h2>
            <button id="addEmployeeBtn" class="bg-teal-600 text-blue-50 px-6 py-2 rounded-lg hover:bg-teal-700 transition flex items-center space-x-2">
                <i class="fas fa-plus"></i>
                <span>Добавить сотрудника</span>
            </button>
        </div>

        <!-- Таблица сотрудников -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-teal-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">ФИО</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Паспорт</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Группа</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Компания</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Профессия</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Куратор</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-teal-800 uppercase tracking-wider">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Данные будут загружены через API -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Модальное окно добавления сотрудника -->
    <div id="employeeModal" class="auth-modal fixed inset-0 flex items-center justify-center z-50">
        <div class="absolute inset-0 bg-black bg-opacity-50"></div>
        <div class="bg-blue-50 rounded-xl shadow-2xl z-10 w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-stone-700">Добавление сотрудника</h3>
                    <button id="closeEmployeeModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Количество сотрудников</label>
                    <input type="number" min="1" value="1" class="w-24 px-4 py-2 border border-blue-200 rounded-lg">
                </div>

                <div class="border-b border-gray-200 mb-6">
                    <ul class="flex flex-wrap -mb-px" id="employeeTabs">
                        <li class="mr-2">
                            <button class="tab-btn active inline-block p-4 border-b-2 border-teal-600 rounded-t-lg text-teal-600" data-tab="personal">Персональные данные</button>
                        </li>
                        <li class="mr-2">
                            <button class="tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="finance">Финансы</button>
                        </li>
                        <li class="mr-2">
                            <button class="tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="contracts">Договоры</button>
                        </li>
                        <li class="mr-2">
                            <button class="tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="visa">VISA</button>
                        </li>
                        <li class="mr-2">
                            <button class="tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="work">Работа</button>
                        </li>
                    </ul>
                </div>

                <form id="employeeForm" class="space-y-4">
                    <!-- Personal Data Tab -->
                    <div id="personalTab" class="tab-content active grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия</label>
                            <input type="text" id="surname" name="surname" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия (EN)</label>
                            <input type="text" id="surname_en" name="surname_en" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
                            <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Имя (EN)</label>
                            <input type="text" id="name_en" name="name_en" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Отчество</label>
                            <input type="text" id="patronymic" name="patronymic" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Отчество (EN)</label>
                            <input type="text" id="patronymic_en" name="patronymic_en" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Серия паспорта</label>
                            <input type="text" id="passport_series" name="passport_series" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер паспорта</label>
                            <input type="text" id="passport_number" name="passport_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата рождения</label>
                            <input type="date" id="birth_date" name="birth_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата выдачи паспорта</label>
                            <input type="date" id="passport_issue_date" name="passport_issue_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата окончания паспорта</label>
                            <input type="date" id="passport_expiry_date" name="passport_expiry_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Место рождения</label>
                            <input type="text" id="birth_place" name="birth_place" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Город прописки</label>
                            <input type="text" id="registration_city" name="registration_city" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Адрес прописки</label>
                            <input type="text" id="registration_address" name="registration_address" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Индекс адреса прописки</label>
                            <input type="text" id="registration_zip" name="registration_zip" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                    </div>

                    <!-- Finance Tab -->
                    <div id="financeTab" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="payment_contribution" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                            <label for="payment_contribution" class="ml-2 block text-sm text-gray-700">Оплата взноса</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="payment_contribution_year" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                            <label for="payment_contribution_year" class="ml-2 block text-sm text-gray-700">Оплата годового взноса</label>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер квитанции</label>
                            <input type="text" id="receipt_number" name="receipt_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата Квитанции</label>
                            <input type="date" id="receipt_date" name="receipt_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="card_ready" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                            <label for="card_ready" class="ml-2 block text-sm text-gray-700">Оформление карты</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="card_get" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                            <label for="card_get" class="ml-2 block text-sm text-gray-700">Выдача карты</label>
                        </div>
                    </div>

                    <!-- Contracts Tab -->
                    <div id="contractsTab" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер договора УВМ</label>
                            <input type="text" id="uvm_contract_number" name="uvm_contract_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер 3-х стороннего договора</label>
                            <input type="text" id="tripartite_contract_number" name="tripartite_contract_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата 3-х стороннего договора</label>
                            <input type="date" id="tripartite_contract_date" name="tripartite_contract_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер 2-х стороннего договора</label>
                            <input type="text" id="bipartite_contract_number" name="bipartite_contract_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата 2-х стороннего договора</label>
                            <input type="date" id="bipartite_contract_date" name="bipartite_contract_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер группы</label>
                            <input type="text" id="group_number" name="group_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата отправки</label>
                            <input type="date" id="shipment_date" name="shipment_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Почтовая компания</label>
                            <input type="text" id="postal_company" name="postal_company" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата возврата</label>
                            <input type="date" id="return_date" name="return_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                    </div>

                    <!-- VISA Tab -->
                    <div id="visaTab" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер приглашения</label>
                            <input type="text" id="invitation_number" name="invitation_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата прибытия</label>
                            <input type="date" id="arrival_date" name="arrival_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Идентификатор визы</label>
                            <input type="text" id="visa_id" name="visa_id" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Серия бланка визы</label>
                            <input type="text" id="visa_form_series" name="visa_form_series" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер визы</label>
                            <input type="text" id="visa_number" name="visa_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата выдачи визы</label>
                            <input type="date" id="visa_issue_date" name="visa_issue_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата получения визы</label>
                            <input type="date" id="visa_receipt_date" name="visa_receipt_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Виза действительна до</label>
                            <input type="date" id="visa_expiry_date" name="visa_expiry_date" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                    </div>

                    <!-- Work Tab -->
                    <div id="workTab" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Компания</label>
                            <select id="company" name="company" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                                <option value="">Выберите компанию...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Директор</label>
                            <input type="text" id="director" name="director" class="w-full px-4 py-2 border border-blue-200 rounded-lg bg-gray-100" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Адрес компании</label>
                            <input type="text" id="company_address" name="company_address" class="w-full px-4 py-2 border border-blue-200 rounded-lg bg-gray-100" readonly>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Адрес прохождения практики</label>
                            <input type="text" id="practice_address" name="practice_address" class="w-full px-4 py-2 border border-blue-200 rounded-lg bg-gray-100" readonly>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Профессия</label>
                            <select id="profession" name="profession" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                                <option value="">Выберите профессию...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Номер профессии</label>
                            <input type="text" id="profession_number" name="profession_number" class="w-full px-4 py-2 border border-blue-200 rounded-lg bg-gray-100" readonly>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Куратор</label>
                            <select id="curator" name="curator" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                                <option value="">Выберите куратора...</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="button" id="cancelEmployeeBtn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                            Отмена
                        </button>
                        <button type="submit" class="bg-teal-600 text-blue-50 px-6 py-2 rounded-lg hover:bg-teal-700 transition">
                            Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования сотрудника -->
    <div id="editEmployeeModal" class="auth-modal fixed inset-0 flex items-center justify-center z-50">
        <div class="absolute inset-0 bg-black bg-opacity-50"></div>
        <div class="bg-blue-50 rounded-xl shadow-2xl z-10 w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-stone-700">Редактирование сотрудника</h3>
                    <button id="closeEditEmployeeModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="border-b border-gray-200 mb-6">
                    <ul class="flex flex-wrap -mb-px" id="editEmployeeTabs">
                        <li class="mr-2">
                            <button class="edit-tab-btn active inline-block p-4 border-b-2 border-teal-600 rounded-t-lg text-teal-600" data-tab="edit-personal">Персональные данные</button>
                        </li>
                        <li class="mr-2">
                            <button class="edit-tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="edit-finance">Финансы</button>
                        </li>
                        <li class="mr-2">
                            <button class="edit-tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="edit-contracts">Договоры</button>
                        </li>
                        <li class="mr-2">
                            <button class="edit-tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="edit-visa">VISA</button>
                        </li>
                        <li class="mr-2">
                            <button class="edit-tab-btn inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="edit-work">Работа</button>
                        </li>
                    </ul>
                </div>

                <form id="editEmployeeForm" class="space-y-4">
                    <!-- Personal Data Tab -->
                    <div id="edit-personalTab" class="edit-tab-content active grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия</label>
                            <input type="text" id="edit_surname" name="edit_surname" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия (EN)</label>
                            <input type="text" id="edit_surname_en" name="edit_surname_en" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
                            <input type="text" id="edit_name" name="edit_name" class="w-full px-4 py-2 border border-blue-200 rounded-lg">
                        </div>

    <script>
        // Загрузка компаний в выпадающий список
        async function loadCompanies() {
            try {
                const response = await fetch('https://localhost:7229/company/allCompanyName');
                const companies = await response.json();
                const companySelect = document.getElementById('company');

                // Очищаем существующие опции кроме первой
                while (companySelect.options.length > 1) {
                    companySelect.remove(1);
                }

                // Добавляем компании в выпадающий список
                companies.forEach(company => {
                    const option = document.createElement('option');
                    option.value = company.id;
                    option.textContent = company.name;
                    companySelect.appendChild(option);
                });

                // Добавляем обработчик изменения выбора компании
                companySelect.addEventListener('change', async function () {
                    if (this.value) {
                        try {
                            const companyResponse = await fetch(`https://localhost:7229/company?idCompany=${this.value}`);
                            const companyData = await companyResponse.json();

                            // Заполняем поля данными компании
                            document.getElementById('director').value = companyData.director || '';
                            document.getElementById('company_address').value = companyData.companyAddress || '';
                            document.getElementById('practice_address').value = companyData.practiceAddress || '';
                        } catch (error) {
                            console.error('Ошибка загрузки данных компании:', error);
                        }
                    } else {
                        // Очищаем поля если компания не выбрана
                        document.getElementById('director').value = '';
                        document.getElementById('company_address').value = '';
                        document.getElementById('practice_address').value = '';
                    }
                });

            } catch (error) {
                console.error('Ошибка загрузки компаний:', error);
            }
        }


        function showSuccessMessage(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        function showErrorMessage(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // Модальное окно подтверждения удаления
        const deleteModal = document.createElement('div');
        deleteModal.id = 'deleteModal';
        deleteModal.className = 'auth-modal fixed inset-0 flex items-center justify-center z-50 hidden';
        deleteModal.innerHTML = `
                    <div class="absolute inset-0 bg-black bg-opacity-50"></div>
                    <div class="bg-blue-50 rounded-xl shadow-2xl z-10 w-full max-w-md mx-4">
                        <div class="p-6">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-2xl font-bold text-stone-700">Подтверждение удаления</h3>
                                <button id="closeDeleteModal" class="text-gray-500 hover:text-gray-700">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="mb-6">
                                <p class="text-gray-700">Вы уверены, что хотите удалить этого студента? Это действие нельзя отменить.</p>
                            </div>
                            <div class="flex justify-end space-x-3">
                                <button id="cancelDelete" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">
                                    Отмена
                                </button>
                                <button id="confirmDelete" class="bg-red-600 text-blue-50 px-6 py-2 rounded-lg hover:bg-red-700">
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                `;
        document.body.appendChild(deleteModal);

        //Функция отображения модального окна для удаления
        function showDeleteModal(studentId) {
            currentStudentIdToDelete = studentId;
            deleteModal.style.display = 'flex';
            document.querySelector('main').classList.add('blur-background');
            document.querySelector('header').classList.add('blur-background');
        }

        function hideDeleteModal() {
            deleteModal.style.display = 'none';
            document.querySelector('main').classList.remove('blur-background');
            document.querySelector('header').classList.remove('blur-background');
            currentStudentIdToDelete = null;
        }

        document.getElementById('closeDeleteModal')?.addEventListener('click', hideDeleteModal);
        document.getElementById('cancelDelete')?.addEventListener('click', hideDeleteModal);
        document.getElementById('confirmDelete')?.addEventListener('click', function () {
            if (currentStudentIdToDelete) {
                const idStudents = [currentStudentIdToDelete];

                fetch(`https://localhost:7229/student`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(idStudents)
                })
                    .then(response => {
                        if (response.ok) {
                            loadStudents(); // Перезагружаем список компаний
                            hideDeleteModal();
                            showSuccessMessage('Студент успешно удален');
                        } else {
                            showErrorMessage('Ошибка при удалении студента');
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting student:', error);
                        showErrorMessage('Ошибка при удалении студента');
                    })
            }
        });

        // Загрузка профессий в выпадающий список
        async function loadProfessions() {
            try {
                const response = await fetch('https://localhost:7229/profession/allProfession');
                const professions = await response.json();
                const professionSelect = document.getElementById('profession');

                // Очищаем существующие опции кроме первой
                while (professionSelect.options.length > 1) {
                    professionSelect.remove(1);
                }

                // Добавляем профессии в выпадающий список
                professions.forEach(profession => {
                    const option = document.createElement('option');
                    option.value = profession.id;
                    option.textContent = profession.professionName;
                    // Сохраняем номер профессии в data-атрибут
                    option.dataset.professionNumber = profession.professionNumber;
                    professionSelect.appendChild(option);
                });

                // Добавляем обработчик изменения выбора профессии
                professionSelect.addEventListener('change', async function () {
                    if (this.value) {
                        try {
                            const professionResponse = await fetch(`https://localhost:7229/profession/profession?id=${this.value}`);
                            const professionData = await professionResponse.json();

                            // Заполняем поле номера профессии
                            document.getElementById('profession_number').value = professionData.professionNumber || '';
                        } catch (error) {
                            console.error('Ошибка загрузки данных профессии:', error);
                        }
                    } else {
                        // Очищаем поле если профессия не выбрана
                        document.getElementById('profession_number').value = '';
                    }
                });

            } catch (error) {
                console.error('Ошибка загрузки профессий:', error);
            }
        }

        // Загрузка данных студентов
        async function loadStudents() {
            try {
                const response = await fetch('https://localhost:7229/student/allStudents?page=1');
                const students = await response.json();
                const tableBody = document.getElementById('studentsTableBody');

                tableBody.innerHTML = students.map(student => `
                                                                <tr class="hover:bg-blue-50 transition">
                                                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${student.id}</td>
                                                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">
                                                                        ${student.surname} ${student.name} ${student.patronymic}
                                                                    </td>
                                                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                                                                        ${student.passportSeries} ${student.passportNumber}

                    body: JSON.stringify(formData)
                });

                currentStudentId = null;

                if (response.ok) {
                    showSuccessMessage('Данные сотрудника успешно обновлены');
                    document.getElementById('editEmployeeModal').style.display = 'none';
                    mainContent.classList.remove('blur-background');
                    header.classList.remove('blur-background');
                    loadStudents(); // Обновляем список сотрудников
                } else {
                    throw new Error('Ошибка при обновлении данных сотрудника');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showErrorMessage('Произошла ошибка при обновлении данных сотрудника');
            }
        });
    </script>
</body>
</html>
